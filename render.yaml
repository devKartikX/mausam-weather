services:
  # ----------------------------------------------------------------------------
  # 1. Mausam Backend (FastAPI Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: mausam-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_URL
        sync: false

  # ----------------------------------------------------------------------------
  # 2. Mausam Frontend (Vite / React Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: mausam-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: mausam-backend
          property: host
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
